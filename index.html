<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>招待状</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Shippori Mincho', serif;
    background:#050a18;
    color:#e8edf7;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 夜空と海 ---------- */
  .sky {
    position:fixed; inset:0;
    background:linear-gradient(to bottom, #02040c 0%, #060d22 38%, #0b1834 62%, #14264a 74%, #0a1430 74.2%, #04091a 100%);
  }
  .star {
    position:absolute; border-radius:50%;
    background:#dfeaff;
    animation:twinkle var(--d) ease-in-out infinite;
    animation-delay:var(--o);
  }
  @keyframes twinkle {
    0%,100% { opacity:var(--lo); }
    50% { opacity:1; }
  }
  .moon {
    position:fixed;
    top:7%; right:10%;
    width:48px; height:48px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fdf9ec, #f0e8cf 60%, #ddd2b0);
    box-shadow:0 0 40px 12px rgba(245,238,214,.28), 0 0 120px 40px rgba(245,238,214,.10);
    transition:opacity 1.4s ease;
  }
  body.reading .moon { opacity:.3; }
  .sea {
    position:fixed; left:0; right:0; bottom:0; height:26%;
    overflow:hidden;
  }
  .moonpath {
    position:absolute; top:0; bottom:0;
    right:calc(10% - 30px); width:108px;
    background:repeating-linear-gradient(to bottom,
      rgba(245,238,214,.16) 0 2px, rgba(245,238,214,0) 2px 7px);
    filter:blur(1px);
    transform:perspective(300px) rotateX(48deg);
    animation:shimmer 3.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { opacity:.5; }
    50% { opacity:.95; }
  }
  .wave {
    position:absolute; bottom:0; left:0;
    width:200%; height:100%;
    animation:drift linear infinite;
  }
  .wave svg { width:100%; height:100%; display:block; }
  .w1 { animation-duration:13s; opacity:.55; }
  .w2 { animation-duration:21s; animation-direction:reverse; opacity:.35; bottom:-12px; }
  @keyframes drift {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }
  .shooting-star {
    position:fixed;
    width:130px; height:1.5px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95));
    border-radius:2px;
    transform:rotate(-32deg);
    animation:shoot 1.3s ease-out forwards;
    pointer-events:none;
  }
  @keyframes shoot {
    0%   { opacity:0; translate:0 0; }
    8%   { opacity:1; }
    100% { opacity:0; translate:-46vw 30vh; }
  }

  /* ---------- ステージ共通 ---------- */
  .stage {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px env(safe-area-inset-right) calc(26vh) env(safe-area-inset-left);
    transition:opacity 1.2s ease;
  }
  .gone { opacity:0 !important; pointer-events:none !important; }

  /* ---------- 封筒 ---------- */
  .seal {
    width:74px; height:74px; border-radius:50%;
    border:1px solid rgba(232,237,247,.45);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:30px; color:#f0e8cf;
    box-shadow:0 0 24px rgba(240,232,207,.12), inset 0 0 18px rgba(240,232,207,.08);
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 18px rgba(240,232,207,.10), inset 0 0 14px rgba(240,232,207,.06); }
    50%     { box-shadow:0 0 34px rgba(240,232,207,.22), inset 0 0 22px rgba(240,232,207,.12); }
  }
  .env-title {
    margin-top:26px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:15px;
    letter-spacing:.42em; text-indent:.42em;
    color:rgba(232,237,247,.75);
  }
  .env-to {
    margin-top:14px; font-size:16px; letter-spacing:.3em; text-indent:.3em;
  }
  .openbtn {
    margin-top:46px;
    font-family:'Cormorant Garamond', serif; font-size:16px; letter-spacing:.5em; text-indent:.5em;
    color:#e8edf7; background:none;
    border:1px solid rgba(232,237,247,.35); border-radius:999px;
    padding:13px 34px 13px 38px;
    cursor:pointer;
    transition:background .4s, border-color .4s;
  }
  .openbtn:hover { background:rgba(232,237,247,.08); border-color:rgba(232,237,247,.6); }

  /* ---------- 手紙 ---------- */
  #letter { opacity:0; pointer-events:none; transition:opacity 1.4s ease .4s; }
  #letter.shown { opacity:1; pointer-events:auto; }
  .line {
    font-size:16px; line-height:2.3;
    letter-spacing:.1em;
    opacity:0; translate:0 14px; filter:blur(4px);
    transition:opacity 1.6s ease, translate 1.6s ease, filter 1.6s ease;
  }
  .line.on { opacity:1; translate:0 0; filter:blur(0); }
  .line.dear { font-size:15px; color:rgba(232,237,247,.8); margin-bottom:14px; }
  .gap { height:1.4em; }
  .when {
    margin-top:30px;
    font-family:'Cormorant Garamond', serif;
    font-size:30px; letter-spacing:.18em; text-indent:.18em;
    color:#f0e8cf;
  }
  .when small { display:block; font-family:'Shippori Mincho', serif; font-size:14px; letter-spacing:.3em; text-indent:.3em; color:rgba(232,237,247,.85); margin-top:10px; }
  .sign {
    margin-top:30px; font-size:14px; letter-spacing:.3em;
    color:rgba(232,237,247,.75);
  }
  .yesbtn {
    margin-top:40px;
    font-family:inherit; font-size:15px; letter-spacing:.6em; text-indent:.6em;
    color:#04091a; background:#f0e8cf;
    border:none; border-radius:999px;
    padding:15px 40px 15px 46px;
    cursor:pointer;
    opacity:0; translate:0 14px;
    transition:opacity 1.6s ease, translate 1.6s ease, transform .15s ease;
    box-shadow:0 0 28px rgba(240,232,207,.25);
  }
  .yesbtn.on { opacity:1; translate:0 0; }
  .yesbtn:active { transform:scale(.96); }

  /* ---------- YES / NO ---------- */
  .btns { display:flex; gap:20px; margin-top:48px; justify-content:center; }
  .ans {
    font-family:'Cormorant Garamond', serif;
    font-size:17px; letter-spacing:.28em; text-indent:.28em;
    padding:14px 34px; border-radius:999px; cursor:pointer;
    transition:opacity 1.6s ease, translate 1.6s ease, transform .15s ease;
  }
  .ans:active { transform:scale(.95); }
  .ans.yes {
    background:#f0e8cf; color:#04091a; border:none;
    box-shadow:0 0 26px rgba(240,232,207,.25);
  }
  .ans.no {
    background:none; color:rgba(232,237,247,.85);
    border:1px solid rgba(232,237,247,.35);
  }

  /* ---------- really?? ---------- */
  #modal {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:rgba(2,4,12,.55);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    opacity:0; pointer-events:none;
    transition:opacity .45s ease;
  }
  #modal.show { opacity:1; pointer-events:auto; }
  .modal-card {
    background:rgba(8,14,34,.92);
    border:1px solid rgba(232,237,247,.22);
    border-radius:20px;
    padding:38px 52px 34px;
    text-align:center;
    box-shadow:0 8px 60px rgba(0,0,0,.55), 0 0 30px rgba(240,232,207,.06);
    transform:translateY(10px) scale(.96);
    transition:transform .45s ease;
  }
  #modal.show .modal-card { transform:translateY(0) scale(1); }
  .modal-title {
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:34px; color:#f0e8cf;
    letter-spacing:.06em;
  }
  .modal-btn {
    margin-top:26px;
    font-family:'Cormorant Garamond', serif; font-size:15px;
    letter-spacing:.3em; text-indent:.3em;
    color:rgba(232,237,247,.85); background:none;
    border:1px solid rgba(232,237,247,.3); border-radius:999px;
    padding:11px 26px; cursor:pointer;
    transition:background .3s;
  }
  .modal-btn:hover { background:rgba(232,237,247,.08); }

  /* ---------- 返事のあと ---------- */
  #after { opacity:0; pointer-events:none; transition:opacity 1.8s ease .8s; }
  #after.shown { opacity:1; }
  .after-main {
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:28px; letter-spacing:.12em; text-indent:.12em;
    line-height:1.8; color:#f0e8cf;
    text-shadow:0 0 24px rgba(240,232,207,.25);
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>
<div class="moon"></div>
<div class="sea">
  <div class="moonpath"></div>
  <div class="wave w1"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,40 C150,70 300,10 450,40 C600,70 750,10 900,40 C1050,70 1200,10 1200,40 L1200,120 L0,120 Z" fill="#0a1736"/></svg></div>
  <div class="wave w2"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,55 C200,85 400,25 600,55 C800,85 1000,25 1200,55 L1200,120 L0,120 Z" fill="#071026"/></svg></div>
</div>

<!-- 封 -->
<div class="stage" id="envelope">
  <p class="env-title">INVITATION</p>
  <button class="openbtn" id="openbtn">open</button>
</div>

<!-- 手紙 -->
<div class="stage" id="letter">
  <div class="line when">6.13 SAT<small>23:30</small></div>
  <div class="line btns">
    <button class="ans yes" id="yesbtn">YES</button>
    <button class="ans no" id="nobtn">NO</button>
  </div>
</div>

<!-- 返事のあと -->
<div class="stage" id="after">
  <p class="after-main">Reservation Successful</p>
</div>

<!-- really?? -->
<div id="modal">
  <div class="modal-card">
    <p class="modal-title">really??</p>
    <button class="modal-btn" id="modalbtn">…return</button>
  </div>
</div>

<script>
  // 星空
  const sky = document.getElementById('sky');
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < .85 ? Math.random() * 1.6 + .6 : Math.random() * 2.4 + 1.4;
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 68 + '%';
    s.style.setProperty('--d',  (Math.random() * 3 + 2.2) + 's');
    s.style.setProperty('--o',  (Math.random() * 4) + 's');
    s.style.setProperty('--lo', (Math.random() * .35 + .15));
    sky.appendChild(s);
  }

  // 流れ星
  function shoot() {
    const st = document.createElement('div');
    st.className = 'shooting-star';
    st.style.left = (30 + Math.random() * 60) + 'vw';
    st.style.top  = (4 + Math.random() * 30) + 'vh';
    document.body.appendChild(st);
    setTimeout(() => st.remove(), 1500);
  }
  setInterval(() => { if (Math.random() < .5) shoot(); }, 4200);

  // ひらく → 手紙
  const envelope = document.getElementById('envelope');
  const letter   = document.getElementById('letter');
  const after    = document.getElementById('after');
  const modal    = document.getElementById('modal');

  document.getElementById('openbtn').addEventListener('click', () => {
    envelope.classList.add('gone');
    letter.classList.add('shown');
    document.body.classList.add('reading');
    setTimeout(() => letter.querySelector('.when').classList.add('on'), 1600);
    setTimeout(() => letter.querySelector('.btns').classList.add('on'), 3200);
    let n = 0;
    const burst = setInterval(() => {
      shoot();
      if (++n >= 6) clearInterval(burst);
    }, 700);
  });

  // YES → 返事
  document.getElementById('yesbtn').addEventListener('click', () => {
    letter.classList.add('gone');
    after.classList.add('shown');
    let n = 0;
    const burst = setInterval(() => {
      shoot();
      if (++n >= 9) clearInterval(burst);
    }, 420);
  });

  // NO → really?? → 手紙に戻る
  document.getElementById('nobtn').addEventListener('click', () => {
    modal.classList.add('show');
  });
  document.getElementById('modalbtn').addEventListener('click', () => {
    modal.classList.remove('show');
  });
</script>
</body>
</html>
